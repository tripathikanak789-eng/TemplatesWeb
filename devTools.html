<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <style>
        p{

</head>
<body>
       <p onclick="green()">Click Me</p>

        let dogs=[{

            let p=document.querySelector("p");

        console.error("oh no");
