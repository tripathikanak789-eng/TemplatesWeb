<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Playwrite+AU+VIC+Guides&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Playwrite+AU+VIC+Guides&display=swap" rel="stylesheet">
    <title>flexpanel</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
            font-family:"Cinzel", serif;
        
        }
        .panel1{background-image: url("Images/build.jpg");
        background-repeat:no-repeat;
        background-size:cover;}
        .panel2{background-image: url("Images/crowd.jpg");
      background-repeat:no-repeat;
        background-size:cover;}
        .panel3{background-image: url("Images/clock.jpg");
      background-repeat:no-repeat;
        background-size:cover;}
        .panel4{background-image: url("Images/images.jpeg");
          background-repeat:no-repeat;
        background-size:cover;}
        .panels{
            display:flex;
            height:100vh;

        }
        .panel{
            background-color: blueviolet;
            display: flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            flex:1;
            color:white;
              transition:font-size 0.7s cubic-bezier(0.61,-0.19, 0.7, 0.11),
                         flex 0.7s cubic-bezier(0.61,-0.19, 0.7, 0.11),
                         background 0.2s;
        }
        p{
            display:flex;
            flex-direction: column;
            width:100%;
            height:100vh;
            text-align: center;
            justify-content: center;
            font-size: 2rem;
            transform:transition 0.7s;
        }
        .panel p:first-child{
            transform:translateY(-100%);
            transition:all 0.05s;
        }
        .panel p:last-child{
               transform:translateY(100%);
            transition:all 0.05s;
        }
        .panel p:nth-child(2){
            font-size:3rem;
        }
        .panel.open{
            font-size:4rem;
            flex:5;
        }
        .panel.open-active p:first-child{transform: translateY(0);  
        }
        .panel.open-active p:last-child{transform: translateY(0);}
    </style>
</head>
<body>
    <div class="panels">
        <div class="panel panel1">
            <p>Hey</p>
            <p>let's</p>
            <p>dance</p>
        </div>
         <div class="panel panel2">
            <p>Give</p>
            <p>take</p>
            <p>receive</p>
        </div>
         <div class="panel panel3">
            <p>Experience</p>
            <p>It</p>
            <p>Today</p>
        </div>
         <div class="panel panel4">
            <p>Give</p>
            <p>all</p>
            <p>today</p>
        </div>
    </div>
    <script>
        let panel=document.querySelectorAll(".panel");
        console.log(panel);
        function op(){
            this.classList.toggle("open");
        }
        function toggleactive(e){
            console.log(e.propertyName);
            if(e.propertyName.includes('flex')){
                this.classList.toggle("open-active");
            }
        }
        panel.forEach(x=>x.addEventListener("click",op));
        panel.forEach(x=>x.addEventListener("transitionend",toggleactive))
    </script>
</body>
</html>
